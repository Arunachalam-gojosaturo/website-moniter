name: Website Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes 24/7 in GitHub Cloud
  workflow_dispatch:        # Manual trigger with options
    inputs:
      force_email:
        description: 'Force send notification email for testing?'
        required: false
        type: boolean
        default: true
      target_url:
        description: 'Target URL to monitor'
        required: false
        type: string
        default: 'https://www.tn-mbamca.com'

permissions:
  contents: write           # Needed to commit status.txt and last_run.txt

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Website Uptime Monitor
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TARGET_URL: ${{ inputs.target_url || 'https://www.tn-mbamca.com' }}
          FORCE_EMAIL: ${{ inputs.force_email || 'false' }}
        run: |
          python3 monitor.py

      - name: Commit & Push Updated Status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.txt last_run.txt
          git diff --staged --quiet || git commit -m "auto: update site status [skip ci]"
          git push
