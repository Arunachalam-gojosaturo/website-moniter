name: Website Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub may delay a bit during high load)
  workflow_dispatch:         # lets you run it manually to test

permissions:
  contents: write            # needed to commit status.txt back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site status
        id: check
        run: |
          URL="https://google.com"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L --max-time 15 "$URL" || echo "000")
          echo "http_status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "site_state=online" >> "$GITHUB_OUTPUT"
          else
            echo "site_state=offline" >> "$GITHUB_OUTPUT"
          fi

      - name: Read previous state
        id: prev
        run: |
          if [ -f status.txt ]; then
            echo "prev_state=$(cat status.txt | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
          else
            echo "prev_state=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Email Alert — Site went DOWN ❌
        if: steps.check.outputs.site_state == 'offline' && steps.prev.outputs.prev_state == 'online'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ ALERT: google.com is DOWN!"
          to: ${{ secrets.EMAIL_TO }}
          from: Site Monitor <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ⚠️ ALERT: google.com is DOWN!
            
            Target URL: https://google.com
            HTTP Status: ${{ steps.check.outputs.http_status }}
            Checked At: ${{ github.run_id }}

      - name: Email Alert — Site came back ONLINE ✅
        if: steps.check.outputs.site_state == 'online' && steps.prev.outputs.prev_state == 'offline'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ RECOVERY: google.com is back ONLINE"
          to: ${{ secrets.EMAIL_TO }}
          from: Site Monitor <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ✅ RECOVERY: google.com is back ONLINE!
            
            Target URL: https://google.com
            HTTP Status: ${{ steps.check.outputs.http_status }}
            Checked At: ${{ github.run_id }}

      - name: Save current state
        run: echo "${{ steps.check.outputs.site_state }}" > status.txt

      - name: Keep-alive marker (stops GitHub auto-disabling this schedule after 60 days idle)
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.txt last_run.txt
          git diff --staged --quiet || git commit -m "update status [skip ci]"
          git push
